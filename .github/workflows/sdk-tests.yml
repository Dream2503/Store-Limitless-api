name: Python SDK checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Run offline regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  deployed-readiness:
    name: Check deployed API readiness
    runs-on: ubuntu-latest
    steps:
      - name: Verify the production readiness endpoint
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          url = "https://cdn-storelimitless.vercel.app/public/ready"
          with urlopen(url, timeout=20) as response:
              payload = json.load(response)
          if not isinstance(payload, dict) or payload.get("ready") is not True:
              raise SystemExit(f"Production readiness check failed: {payload!r}")
          print("Production API is ready:", payload)
          PY

  package-build:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

  live-smoke:
    name: Optional deployed API smoke test
    runs-on: ubuntu-latest
    env:
      STORELIMITLESS_E2E_API_URL: https://cdn-storelimitless.vercel.app
      STORELIMITLESS_E2E_USERNAME: ${{ secrets.STORELIMITLESS_E2E_USERNAME }}
      STORELIMITLESS_E2E_PASSWORD: ${{ secrets.STORELIMITLESS_E2E_PASSWORD }}
      STORELIMITLESS_E2E_ALLOW_MUTATIONS: ${{ secrets.STORELIMITLESS_E2E_ALLOW_MUTATIONS }}
    steps:
      - name: Check out repository
        if: ${{ env.STORELIMITLESS_E2E_USERNAME != '' && env.STORELIMITLESS_E2E_PASSWORD != '' && env.STORELIMITLESS_E2E_ALLOW_MUTATIONS == '1' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ env.STORELIMITLESS_E2E_USERNAME != '' && env.STORELIMITLESS_E2E_PASSWORD != '' && env.STORELIMITLESS_E2E_ALLOW_MUTATIONS == '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        if: ${{ env.STORELIMITLESS_E2E_USERNAME != '' && env.STORELIMITLESS_E2E_PASSWORD != '' && env.STORELIMITLESS_E2E_ALLOW_MUTATIONS == '1' }}
        run: python -m pip install -e .

      - name: Run live account workflow
        if: ${{ env.STORELIMITLESS_E2E_USERNAME != '' && env.STORELIMITLESS_E2E_PASSWORD != '' && env.STORELIMITLESS_E2E_ALLOW_MUTATIONS == '1' }}
        run: python tests/live_smoke.py

      - name: Explain skipped live test
        if: ${{ env.STORELIMITLESS_E2E_USERNAME == '' || env.STORELIMITLESS_E2E_PASSWORD == '' || env.STORELIMITLESS_E2E_ALLOW_MUTATIONS != '1' }}
        run: echo "Live test skipped. Configure dedicated test-account secrets and explicit mutation opt-in to enable it."
