[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storelimitless"
version = "0.1.1"
description = "Python SDK for StoreLimitless"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "tqdm",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storelimitless = [
    "bin/linux/*",
    "bin/windows/*",
]